<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1 style="font-size: 90px; text-align: center;">Iniciar sesión</h1>
    <form>
        <div style="text-align: center;"> 
            <label for="username" style="display: block;">Nombre de usuario:</label>
            <input type="text" id="username" name="username" required style="width: 200px; height: 25px;">
            <br>

            <label for="password" style="display: block;">Contraseña:</label>
            <input type="password" id="password" name="password" required style="width: 200px; height: 25px;">
            <br>

            <button type="submit" style="font-size: 20px; padding: 5px 10px;" style="margin-top: auto;"><a href="index.html">Iniciar sesión</a></button>

        </div>
    </form>
</body>

</footer>
</html>
